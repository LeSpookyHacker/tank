title: Helix Robotics — Unusual S3 Bulk Download by Non-Automation Principal
status: stable
description: >
  Detects an IAM principal performing more than 500 S3 GetObject operations
  within a 5-minute window, excluding known automation principals (dbt-pipeline,
  backup-agent). This pattern matches potential data exfiltration from Helix's
  production S3 buckets, particularly helix-prod-analytics-staging and
  helix-prod-logs.

  This rule was written following INC-2025-0047 (device cert exposure) and
  the known risk of analytics-pipeline cross-account access (HELIX-TBD).
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: GetObject
    eventSource: s3.amazonaws.com
    resources.ARN|startswith: "arn:aws:s3:::helix-prod"
  filter_automation:
    userIdentity.arn|contains:
      - "assumed-role/dbt-pipeline-role"
      - "assumed-role/backup-agent-role"
      - "assumed-role/helix-analytics-read"
  timeframe: 5m
  condition: selection and not filter_automation | count() by userIdentity.arn > 500
falsepositives:
  - New automation job not yet added to the filter list (coordinate with Fatima Al-Amin)
  - Security team running data inventory scan (announce in #security-ops first)
level: high
tags:
  - attack.exfiltration
  - attack.t1530
  - helix.s3
  - helix.data-exfiltration
references:
  - https://attack.mitre.org/techniques/T1530/
  - "Internal: analytics-pipeline cross-account IAM role review (HELIX-TBD)"
