title: Unexpected Secret Manager Access
id: 6b1f2a30-medscribe-0004-secretmgr-access
status: experimental
description: >
  Detects a GCP service account accessing a Secret Manager secret it is not the
  designated consumer of (e.g. `ai-summary@` reading the FHIR OAuth secret). May
  indicate a compromised SA or lateral movement toward total PHI compromise (T-013).
references:
  - https://attack.mitre.org/techniques/T1552/001/
  - internal:T-013
author: AppSec (MedScribe-R-Us)
date: 2026/05/21
tags:
  - attack.credential_access
  - attack.t1552.001
logsource:
  product: gcp
  service: cloudaudit
  category: data_access
detection:
  selection:
    protoPayload.methodName: 'google.cloud.secretmanager.v1.SecretManagerService.AccessSecretVersion'
  expected:
    # each SA may only read its own secret prefix
    binding|expand: '%sa%/%secret_prefix%'
  condition: selection and not expected
fields:
  - protoPayload.authenticationInfo.principalEmail
  - protoPayload.resourceName
falsepositives:
  - Approved break-glass access (correlate with the break-glass audit channel)
level: critical
