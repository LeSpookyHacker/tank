[project]
name = "ai-summarization-svc"
version = "0.4.2"
description = "MedScribe-R-Us AI Summarization Engine (Vertex AI Gemini)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.6.4",
    "google-cloud-aiplatform==1.48.0",
    "google-cloud-secret-manager==2.19.0",
    "pymongo==4.6.3",
    "structlog==24.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.1.1", "semgrep==1.66.0", "pip-audit==2.7.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
