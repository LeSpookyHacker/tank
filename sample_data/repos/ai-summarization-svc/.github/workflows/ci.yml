name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
  # NOTE: security gates not yet wired (P2 backlog) — see security-gates-policy.
  # sast (semgrep), sca (pip-audit), secrets (gitleaks), container (trivy) TODO.
