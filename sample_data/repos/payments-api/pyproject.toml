[tool.poetry]
name = "payments-api"
version = "2.14.3"
description = "Helix Robotics payments service"
authors = ["Sam Liu <sam.liu@helixrobotics.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9"
sqlalchemy = "^2.0"
asyncpg = "^0.29"
alembic = "^1.13"
stripe = "^11.0"
httpx = "^0.27"
hvac = "^2.2"             # HashiCorp Vault client
python-jose = {extras = ["cryptography"], version = "^3.3"}
prometheus-client = "^0.21"
structlog = "^24.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
httpx = "^0.27"
ruff = "^0.7"
mypy = "^1.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
