---
# Kubernetes RBAC for pii-vault service account
# Namespace: production
# Service Account: pii-vault-sa
#
# Security review: 2025-10-20
# Reviewer: diana.okoro@helixrobotics.com
# Status: FINDING — secrets/get is namespace-wide (should be pii-vault namespace only)
# Jira: HELIX-2101

apiVersion: v1
kind: ServiceAccount
metadata:
  name: pii-vault-sa
  namespace: production
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::999988887777:role/pii-vault-irsa-role"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pii-vault-cluster-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
    # Acceptable: read-only pod listing for health checks
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames: ["pii-vault-config"]
    # Acceptable: scoped to named ConfigMap
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    # SECURITY FINDING: This grants secrets/get cluster-wide.
    # pii-vault only needs to read its own Vault agent token secret in the
    # 'production' namespace. Should use a Role + RoleBinding scoped to
    # namespace=production, resourceNames=["vault-agent-token-pii-vault"].
    # Any container escape from pii-vault could read all Secrets in the cluster.
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
    # Acceptable: needed for Vault service discovery

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pii-vault-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: pii-vault-sa
    namespace: production
roleRef:
  kind: ClusterRole
  name: pii-vault-cluster-role
  apiGroup: rbac.authorization.k8s.io

---
# Network Policy (for reference — not RBAC, but paired)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pii-vault-ingress
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: pii-vault
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: payments-api
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53
