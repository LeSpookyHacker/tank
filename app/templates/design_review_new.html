{% extends "base.html" %}
{% block title %}Tank — new design review{% endblock %}

{% block content %}
<section class="dr-new-page">
  <header class="page-head">
    <h1>New design review</h1>
    <p class="dim">Freewrite the design. Tank will scaffold a scope
      summary, risk areas, missing info, suggested reviewers, and a
      checklist.</p>
  </header>

  <form id="dr-form" onsubmit="return submitReview(event);">
    <label>Title
      <input name="title" required
             placeholder="mTLS between payments-api and identity-svc">
    </label>
    <label>Requester (your name or the team's)
      <input name="requester"
             placeholder="Marcus / payments-team">
    </label>
    <label>Design proposal (freewrite)
      <textarea name="freewrite" rows="14" required
                placeholder="Describe the design. What changes, who's
affected, what data flows differently, what's new vs existing, what
you're worried about. Plain English is fine."></textarea>
    </label>
    <button class="btn">scaffold</button>
  </form>
</section>

<script nonce="{{ request.state.csp_nonce }}">
async function submitReview(e) {
  e.preventDefault();
  const f = e.target;
  const resp = await fetch("/api/design-reviews", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      title: f.title.value,
      requester: f.requester.value || null,
      freewrite: f.freewrite.value,
    }),
  });
  const data = await resp.json();
  if (data.id) {
    window.location = "/design-reviews/" + data.id;
  } else {
    alert("intake failed");
  }
  return false;
}
</script>
{% endblock %}
