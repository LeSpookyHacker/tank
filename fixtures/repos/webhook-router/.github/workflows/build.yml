name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::777766665555:role/gha-webhook-router-deploy
          aws-region: us-west-2
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE="999988887777.dkr.ecr.us-west-2.amazonaws.com/webhook-router:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
